[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flaxkv"
description = "A high-performance dictionary database."
authors = [
    { name = "K.Y", email = "beidongjiedeguang@gmail.com" },
]

keywords = ["database", "kv", "leveldb", "persistent", "dictionary", "nosql"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent",
]
requires-python = ">=3.8"
dependencies = [
    "loguru>=0.7.0",
    "orjson>=3.9",
    "rich",
    "psutil",
    "fire",
    "pytz",
    "numpy",
    "msgspec>=0.18.4",
    "msgpack",
    "plyvel>=1.5.0; sys_platform == 'linux'",
    "plyvel-ci>=1.5.0; sys_platform == 'win32'",
    "plyvel-ci>=1.5.0; sys_platform == 'darwin'",
    "typing-extensions>=4.7.1; python_version<'3.11'",
]

dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/KenyonY/flaxkv"
Documentation = "https://github.com/KenyonY/flaxkv#flaxkv"
Issues = "https://github.com/KenyonY/flaxkv/issues"
Source = "https://github.com/KenyonY/flaxkv"

[project.optional-dependencies]
# 开发依赖
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

# 测试依赖
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
]


[tool.hatch.version]
path = "flaxkv/__init__.py"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--verbose",
    "-ra",
]
asyncio_mode = "auto"
python_files = ["test_*.py", "*_test.py"]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.isort]
profile = "black"
line_length = 120

[tool.hatch.build]
include = [
    "flaxkv/**/*.py",
]
exclude = [
    "tests"
]

[tool.hatch.build.targets.wheel]
packages = ["flaxkv"]
