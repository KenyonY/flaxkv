# Install
# 1. pip install pre-commit
# 2. pre-commit install (first time)
repos:
- repo: https://github.com/pycqa/isort
  rev: 5.13.2
  hooks:
   - id: isort
     args: ["--profile", "black"]
- repo: https://github.com/psf/black
  rev: 24.3.0
  hooks:
  - id: black
    types: [python]
    exclude: docs/